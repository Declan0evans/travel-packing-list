<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Packing List</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:600px;margin:auto;background:white;padding:30px;border-radius:16px}
input[type=text]{width:65%;box-sizing:border-box;padding:12px;border:1px solid #67e8f9;border-radius:7px}
button{background:#0891b2;color:white;border:0;padding:12px;border-radius:7px;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;background:#cffafe;padding:15px;margin-top:10px;border-radius:8px}
.item span{flex:1;overflow-wrap:anywhere}
.packed{text-decoration:line-through;color:#64748b}
progress{width:100%;height:20px}
</style>
</head>
<body>
<main>
<h1>Travel Packing List</h1>
<p>Prepare everything before your next trip.</p>
<input id="item" type="text" placeholder="Enter packing item">
<button onclick="addItem()">Add Item</button>
<h3 id="summary"></h3>
<progress id="progress" max="100" value="0"></progress>
<div id="items"></div>
</main>
<script>
let items=JSON.parse(localStorage.getItem("packingList")||"[]");
function save(){
 localStorage.setItem("packingList",JSON.stringify(items));
 render();
}
function addItem(){
 const input=document.getElementById("item");
 if(!input.value.trim())return;
 items.push({name:input.value.trim(),packed:false});
 input.value="";
 save();
}
function render(){
 const list=document.getElementById("items");
 list.innerHTML="";
 items.forEach((item,i)=>{
  const row=document.createElement("div");
  row.className="item";
  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=item.packed;
  check.onchange=()=>{
   items[i].packed=check.checked;
   save();
  };
  const name=document.createElement("span");
  name.textContent=item.name;
  if(item.packed)name.className="packed";
  const del=document.createElement("button");
  del.textContent="Remove";
  del.onclick=()=>{
   items.splice(i,1);
   save();
  };
  row.append(check,name,del);
  list.appendChild(row);
 });
 const packed=items.filter(i=>i.packed).length;
 document.getElementById("summary").textContent=
 packed+" of "+items.length+" items packed";
 document.getElementById("progress").value=
 items.length?packed/items.length*100:0;
}
render();
</script>
</body>
</html>
