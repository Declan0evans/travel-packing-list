<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Packing List</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:15px}
input{padding:12px;width:65%;box-sizing:border-box}
button{padding:11px;background:#0891b2;color:white;border:0;border-radius:7px;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;background:#cffafe;padding:12px;margin:9px 0;border-radius:8px}
.item span{flex:1}
.done{text-decoration:line-through;color:#64748b}
#progress{margin:15px 0;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Travel Packing List</h1>
<input id="item" placeholder="Enter an item">
<button onclick="addItem()">Add Item</button>
<p id="progress">0 items packed</p>
<div id="list"></div>
</main>
<script>
let items=JSON.parse(localStorage.getItem("packingItems")||"[]");
function save(){
 localStorage.setItem("packingItems",JSON.stringify(items));
 render();
}
function addItem(){
 const field=document.getElementById("item");
 const name=field.value.trim();
 if(!name)return;
 items.push({name,packed:false});
 field.value="";
 save();
}
function render(){
 const list=document.getElementById("list");
 list.innerHTML="";
 items.forEach((item,i)=>{
  const row=document.createElement("div");
  row.className="item";
  const checkbox=document.createElement("input");
  checkbox.type="checkbox";
  checkbox.style.width="auto";
  checkbox.checked=item.packed;
  checkbox.onchange=()=>{items[i].packed=checkbox.checked;save();};
  const text=document.createElement("span");
  text.textContent=item.name;
  if(item.packed)text.className="done";
  const del=document.createElement("button");
  del.textContent="Remove";
  del.onclick=()=>{items.splice(i,1);save();};
  row.append(checkbox,text,del);
  list.appendChild(row);
 });
 const packed=items.filter(x=>x.packed).length;
 document.getElementById("progress").textContent=
 `${packed} of ${items.length} items packed`;
}
render();
</script>
</body>
</html>
